name: Deploy GitHub page

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Validate site builds before merging; PRs do not deploy.
  pull_request:
    branches: ["master"]
    paths:
      - "gh-pages/**"
      - ".github/workflows/gh-pages.yml"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}"
  cancel-in-progress: true

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
        working-directory: ./gh-pages
      - run: npx tailwindcss -i ./input.css -o ./output.css
        working-directory: ./gh-pages
      - run: mkdir out && mv *.png index.html output.css out
        working-directory: ./gh-pages
      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages
          path: ./gh-pages/out

  # Deployment job
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
